services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    # container_name: hd_backend_prod # Removed to allow scaling
    restart: always
    expose:
      - "3000" # Internal port for Nginx
    # ports: # Removed external binding, handled by Nginx
    #   - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://mv962:password@postgres:5432/hd_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - postgres
      - redis
    networks:
      - hd_network

  nginx:
    image: nginx:alpine
    container_name: hd_nginx_lb
    restart: always
    ports:
      - "3000:80" # Host 3000 -> Nginx 80
    volumes:
      - ./backend/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - hd_network

  postgres:
    image: postgres:15-alpine
    container_name: hd_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: mv962
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hd_db
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - hd_network

  redis:
    image: redis:7-alpine
    container_name: hd_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - hd_network

  prometheus:
    image: prom/prometheus:latest
    container_name: hd_prometheus
    restart: always
    volumes:
      - ./backend/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hd_network

  grafana:
    image: grafana/grafana:latest
    container_name: hd_grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000" # Map 3000 inside container to 3001 on host (since 3000 is backend)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - hd_network

networks:
  hd_network:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  prometheus_data:
  grafana_data:
