name: iOS CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Install dependencies
      run: |
        cd mobile_ios
        pod install || true
    
    - name: Build
      run: |
        cd mobile_ios
        xcodebuild -workspace mobile_ios.xcworkspace \
          -scheme mobile_ios \
          -sdk iphonesimulator \
          -configuration Debug \
          build
  
  test:
    runs-on: macos-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Run tests
      run: |
        cd mobile_ios
        xcodebuild -workspace mobile_ios.xcworkspace \
          -scheme mobile_ios \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 14' \
          test
  
  archive:
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    needs: [build, test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Archive
      run: |
        cd mobile_ios
        xcodebuild -workspace mobile_ios.xcworkspace \
          -scheme mobile_ios \
          -sdk iphoneos \
          -configuration Release \
          archive \
          -archivePath $PWD/build/mobile_ios.xcarchive
    
    - name: Export IPA
      run: |
        cd mobile_ios
        xcodebuild -exportArchive \
          -archivePath $PWD/build/mobile_ios.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath $PWD/build
    
    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: mobile_ios
        path: mobile_ios/build/*.ipa
