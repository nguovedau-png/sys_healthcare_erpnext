name: Healthcare backend quality

on:
  push:
    paths:
      - 'external_apps/backend/**'
      - '.github/workflows/healthcare-backend-quality.yml'
  pull_request:
    paths:
      - 'external_apps/backend/**'
      - '.github/workflows/healthcare-backend-quality.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external_apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: external_apps/backend/package-lock.json
      - name: Install dependencies and generate Prisma clients
        run: npm ci
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://quality:quality@localhost:5432/quality
        run: npm run prisma:validate && npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test -- --runInBand --silent
      - name: Production compile
        run: npm run build
      - name: Repository whitespace check
        working-directory: .
        run: git diff --check
      - name: Active product documentation check
        working-directory: .
        run: test -s docs/improved-product-scope-2026.md && test -s docs/development-plan-vietnam-outpatient-2026.md
