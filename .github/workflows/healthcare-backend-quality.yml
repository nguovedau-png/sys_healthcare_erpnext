name: Healthcare backend quality

on:
  push:
    paths:
      - 'external_apps/backend/**'
      - '.github/workflows/healthcare-backend-quality.yml'
  pull_request:
    paths:
      - 'external_apps/backend/**'
      - '.github/workflows/healthcare-backend-quality.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external_apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: external_apps/backend/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies and generate Prisma clients
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm exec prisma generate
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://quality:quality@localhost:5432/quality
        run: pnpm run prisma:validate && pnpm exec prisma generate
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit and integration tests
        run: pnpm exec jest --runInBand --silent
      - name: Production compile
        run: pnpm run build
      - name: Repository whitespace check
        working-directory: .
        run: git diff --check
      - name: Active product documentation check
        working-directory: .
        run: test -s docs/improved-product-scope-2026.md && test -s docs/development-plan-vietnam-outpatient-2026.md
